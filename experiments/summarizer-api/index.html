<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="keywords" content="ae app labs,android,html,web apps,adobe air,learning,tutorials,consulting" >
		<meta name="theme-color" content="#1b8878" >
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
		<title>Summarizer API</title>
  </head>
<body>
  <section class="section">
    <div class="container" style="max-width: 800px;">
      
      <div class="has-text-centered mb-6">
        <h1 class="title is-2 has-text-primary">AI Summarizer API Test</h1>
        <p class="subtitle is-6">Testing Streaming Summarizer Interface</p>
      </div>

      <div id="statusNotification" class="notification is-warning is-light mb-5">
        <button class="delete" onclick="this.parentElement.classList.add('is-hidden')"></button>
        <span id="statusMessage">Checking Summarizer availability...</span>
      </div>

      <div class="card has-background-dark is-borderless mb-5">
        <div class="card-content">
          <div class="field">
            <label class="label">Text to Summarize</label>
            <div class="control">
              <textarea id="inputText" class="textarea is-primary" rows="8" placeholder="Paste your text here..."></textarea>
            </div>
            <p class="help has-text-right" id="charCount">0 characters</p>
          </div>

          <div class="buttons is-right">
            <button id="clearBtn" class="button is-light">
              <span class="icon"><i class="fas fa-trash"></i></span>
              <span>Clear</span>
            </button>
            <button id="summarizeBtn" class="button is-primary" disabled>
              <span class="icon"><i class="fas fa-magic"></i></span>
              <span>Summarize</span>
            </button>
          </div>
        </div>
      </div>

      <div id="resultCard" class="card is-hidden">
        <header class="card-header has-background-dark">
          <p class="card-header-title">
            <span class="icon has-text-info mr-2"><i class="fas fa-file-alt"></i></span>
            Summary Output (Streaming)
          </p>
        </header>
        <div class="card-content">
          <div id="outputText" class="content" style="white-space: pre-wrap;">
            </div>
        </div>
      </div>

    </div>
  </section>

  <script defer src="https://use.fontawesome.com/releases/v5.15.4/js/all.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const inputText = document.getElementById('inputText');
      const outputText = document.getElementById('outputText');
      const resultCard = document.getElementById('resultCard');
      const summarizeBtn = document.getElementById('summarizeBtn');
      const clearBtn = document.getElementById('clearBtn');
      const statusNotification = document.getElementById('statusNotification');
      const statusMessage = document.getElementById('statusMessage');
      const charCount = document.getElementById('charCount');

      // 1. Graceful Fallback Check
      if (typeof Summarizer === 'undefined') {
        statusNotification.className = "notification is-danger mb-5";
        statusMessage.textContent = "Fallback: The global 'Summarizer' object is not available in this browser. Ensure your experimental flags are matching this implementation.";
      } else {
        // API is available, hide notification and enable button
        statusNotification.classList.add('is-hidden');
        summarizeBtn.removeAttribute('disabled');
      }

      // 2. Character Counter Listener
      inputText.addEventListener('input', () => {
        charCount.textContent = `${inputText.value.length} characters`;
      });

      // 3. Clear Button Logic
      clearBtn.addEventListener('click', () => {
        inputText.value = '';
        charCount.textContent = '0 characters';
        outputText.textContent = '';
        resultCard.classList.add('is-hidden');
      });

      // 4. Summarize Stream Execution
      summarizeBtn.addEventListener('click', async () => {
        const contentBody = inputText.value.trim();
        if (!contentBody) {
          alert('Please enter some text to summarize.');
          return;
        }

        // Setup loading layout
        summarizeBtn.classList.add('is-loading');
        summarizeBtn.setAttribute('disabled', 'true');
        resultCard.classList.remove('is-hidden');
        outputText.textContent = ''; // Clear previous outputs

        try {
          // Initialize via your working signature
          const summarizer = await Summarizer.create({
            expectedInputLanguages: ['en'],
            expectedContextLanguages: ['en'],
            outputLanguage: 'en',
            type: 'headline',
            preference: 'speed',
            sharedContext: 'Write click inviting headlines'
          });

          // Handle the streaming response by APPENDING each new chunk
          for await (const chunk of summarizer.summarizeStreaming(contentBody)) {
            outputText.textContent += chunk; 
          }

        } catch (error) {
          statusNotification.className = "notification is-danger mb-5";
          statusNotification.classList.remove('is-hidden');
          statusMessage.textContent = `Execution Error: ${error.message}`;
          outputText.innerHTML = `<span class="has-text-danger">Failed to execute stream. See error above.</span>`;
        } finally {
          summarizeBtn.classList.remove('is-loading');
          summarizeBtn.removeAttribute('disabled');
        }
      });
    });
  </script>
</body>
</html>
